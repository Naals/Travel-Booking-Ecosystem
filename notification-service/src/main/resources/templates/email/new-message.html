<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Message</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 40px auto; padding: 24px; }
        .header { background: #1a56db; color: white; padding: 24px; border-radius: 8px 8px 0 0; }
        .body { background: #f9fafb; padding: 32px; border-radius: 0 0 8px 8px; }
        .preview { background: white; border-left: 3px solid #1a56db; padding: 12px 16px;
            margin: 16px 0; font-style: italic; color: #4b5563; }
        .button { display: inline-block; background: #1a56db; color: white;
            padding: 12px 24px; border-radius: 6px; text-decoration: none;
            font-weight: bold; margin-top: 16px; }
        .footer { text-align: center; color: #6b7280; font-size: 12px; margin-top: 24px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 style="margin:0">You have a new message</h1>
    </div>
    <div class="body">
        <p>Hi <strong th:text="${fullName}">Traveller</strong>,</p>
        <p>You've received a new message:</p>
        <div class="preview" th:text="${preview}">"Hey, is the property still available for..."</div>
        <a class="button" th:href="${conversationUrl}">Reply Now</a>
    </div>
    <div class="footer">
        <p>© 2024 TravelPlatform. All rights reserved.</p>
    </div>
</div>
</body>
</html>
