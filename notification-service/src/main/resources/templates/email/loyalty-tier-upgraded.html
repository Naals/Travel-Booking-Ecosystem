<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tier Upgraded</title>
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 40px auto; padding: 24px; }
        .header { background: #92400e; color: white; padding: 24px; border-radius: 8px 8px 0 0; }
        .body { background: #f9fafb; padding: 32px; border-radius: 0 0 8px 8px; }
        .tier-box { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px;
            padding: 20px; text-align: center; margin: 16px 0; }
        .tier-box .tier { font-size: 28px; font-weight: bold; color: #92400e; letter-spacing: 1px; }
        .footer { text-align: center; color: #6b7280; font-size: 12px; margin-top: 24px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 style="margin:0">Congratulations on your tier upgrade! 🏆</h1>
    </div>
    <div class="body">
        <p>Hi <strong th:text="${fullName}">Traveller</strong>,</p>
        <p>You've reached a new membership tier:</p>
        <div class="tier-box">
            <div class="tier" th:text="${newTier}">GOLD</div>
        </div>
        <p>Keep travelling to unlock even more benefits.</p>
    </div>
    <div class="footer">
        <p>© 2024 TravelPlatform. All rights reserved.</p>
    </div>
</div>
</body>
</html>
