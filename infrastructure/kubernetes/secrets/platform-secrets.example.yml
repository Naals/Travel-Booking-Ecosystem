# Template only. Copy this to platform-secrets.yml and fill in real
# values before applying — platform-secrets.yml is already covered by
# .gitignore's **/*-secrets.yml rule (Day 1), so it was never at risk
# of being committed; it simply never existed as a file anywhere,
# committed or not. Every Deployment that does `secretRef:
# platform-secrets` (four on Day 4, every Tier 2-4 service via the new
# Helm chart today) has been referencing a Secret this repo never
# actually specified the shape of.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: travel-platform
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  MONGO_USERNAME: "CHANGE_ME"
  MONGO_PASSWORD: "CHANGE_ME"
  EUREKA_USERNAME: "CHANGE_ME"
  EUREKA_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_minimum_256_bits"
  STRIPE_SECRET_KEY: "CHANGE_ME"
